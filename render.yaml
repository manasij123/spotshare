services:
  - type: web
    name: spotshare-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: spotshare-db
          property: connectionString
      - key: NOMINATIM_USER_AGENT
        value: "SpotShare/1.0 (+https://render.com)"
      # Fill these in with your deployed frontend URL once it exists (e.g.
      # the Vercel URL from step 2 of DEPLOY.md), then save to redeploy.
      - key: CLIENT_ORIGIN
        value: "http://localhost:5173"
      - key: PUBLIC_APP_URL
        value: "http://localhost:5173"

databases:
  - name: spotshare-db
    plan: free
    databaseName: spotshare
    user: spotshare
